<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Ops+One&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Product Management</h1>

    <h3>Add Products</h3>
    <div class="form-container">
        <input type="text" autofocus required id="title" placeholder="Product Title">
        <input type="number" required id="price" placeholder="Price">
        <input type="text" required id="description" placeholder="Description">
        <input type="url" required id="img" placeholder="Image URL">
        <input type="text" required id="category" placeholder="Category">
        <button onclick="addProduct()">Add Product</button>
    </div>

    <h3>Get Products</h3>
    <div class="form-container">
        <input type="number" id="getid" placeholder="Enter the id" >
        <button onclick="getProduct()">Get Product</button>
        <p id="errormsg"></p>
        <div id="getProducts">

        </div>
    </div>

    <h3>Delete Products</h3>
    <div class="form-container">
        <input type="number" id="deleteid"  placeholder="Enter the id">
        <button onclick="deleteProduct()">Delete Product</button>
        <p id="errormsgdel"></p>
    </div>

    <h3> <button onclick="reset()">Reset</button></h3>
   

    <div id="products">
        
    </div>

    <script src="script.js"></script>
</body>
</html>
